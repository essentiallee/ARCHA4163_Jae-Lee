<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>NYC Art Planner</title>

  <link rel="stylesheet" href="styles/style.css">

  <script src="https://d3js.org/d3.v7.min.js"></script>

  <link
    href="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.css"
    rel="stylesheet"
  >
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.25.0/mapbox-gl.js"></script>
</head>

<body>
  <main class="planner-app">
    <header class="planner-header">
      <h1>NYC Art Planner</h1>
    </header>

    <section class="map-canvas" aria-label="New York gallery map">
      <div id="mapbox-container-1"></div>

      <section class="timeline-overlay" aria-label="Gallery timeline">
        <div id="d3-container-1" class="canvas-box"></div>
      </section>

      <section
        id="gallery-assistant"
        class="chat-overlay"
        aria-labelledby="gallery-assistant-title"
      >
        <div class="chat-overlay-heading">
          <h2 id="gallery-assistant-title">Gallery Assistant</h2>
          <span class="assistant-data-label">CSV DATA</span>
        </div>

        <div class="gallery-chat-shell">
          <div
            id="gallery-chat-messages"
            class="gallery-chat-messages"
            role="log"
            aria-live="polite"
            aria-label="Conversation with the gallery assistant"
          >
            <div class="gallery-chat-message assistant-message">
              <div class="gallery-chat-message-label">GALLERY ASSISTANT</div>
              <p>Ask me about galleries in the project CSV.</p>
            </div>
          </div>

          <form id="gallery-chat-form" class="gallery-chat-form">
            <label for="gallery-chat-input">Ask a gallery question</label>

            <div class="gallery-chat-input-row">
              <textarea
                id="gallery-chat-input"
                name="question"
                rows="2"
                maxlength="600"
                placeholder="Which galleries are in Chelsea?"
                required
              ></textarea>

              <button id="gallery-chat-send" type="submit">Send</button>
            </div>

            <span
              id="gallery-chat-status"
              class="gallery-chat-status"
              role="status"
            >Ready</span>
          </form>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="javascript/firebase-analytics.js?v=3"></script>
  <script src="javascript/d3-temporal.js?v=6"></script>
  <script src="javascript/mapBox-sketch-01.js?v=5"></script>
  <script src="javascript/gallery-chat.js?v=2"></script>
</body>

</html>
